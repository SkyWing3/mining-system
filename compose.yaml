name: mining-system

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mining_system
      MYSQL_USER: mining
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - central
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    image: mining-system-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Urls: http://0.0.0.0:8080
      Mining__DataDirectory: /var/lib/mining-system
      Mining__ConnectionString: Server=mysql;Port=3306;Database=mining_system;User ID=mining;SslMode=Preferred;CharSet=utf8mb4
      Mining__PasswordFile: /run/secrets/mysql_password
      Mining__AllowedOrigins__0: ${MINING_PUBLIC_ORIGIN:-http://franco-rasp4.local}
      Mining__KnownProxyNetworks__0: ${MINING_DOCKER_SUBNET:-172.30.84.0/24}
    volumes:
      - central-data:/var/lib/mining-system
    secrets:
      - mysql_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - central
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web-app:
    image: mining-system-web-app:local
    build:
      context: .
      dockerfile: web-app/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MINING_HTTP_PORT:-80}:8080"
    networks:
      - central
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  central-data:
  mysql-data:

secrets:
  mysql_password:
    file: ${MINING_SECRETS_DIRECTORY:-./secrets}/mysql_password
  mysql_root_password:
    file: ${MINING_SECRETS_DIRECTORY:-./secrets}/mysql_root_password

networks:
  central:
    ipam:
      config:
        - subnet: ${MINING_DOCKER_SUBNET:-172.30.84.0/24}
