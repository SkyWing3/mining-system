; Firmware de la manilla minera para ESP32-S3 DevKitC.
;
;   pio run -e esp32-s3-n16r8 -t upload      compilar y grabar (placa N16R8, 16 MB)
;   pio run -e esp32-s3-n8 -t upload         variante con 8 MB de flash
;   pio device monitor                       consola serie (115200 baudios, cualquier conector)
;   pio test -e native                       pruebas de la lógica en el computador
;
; La lógica (menú, umbrales, alertas, protocolo, colas, configuración) vive en
; lib/core y no depende de Arduino; src/ contiene solo los controladores del
; ESP32 y las tareas de FreeRTOS.

[platformio]
default_envs = esp32-s3-n16r8

[common]
lib_core_deps =
    bblanchon/ArduinoJson @ ^7.2.0

[esp32s3]
platform = espressif32 @ 7.0.1
framework = arduino
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ${common.lib_core_deps}
    olikraus/U8g2 @ ^2.35.9
    links2004/WebSockets @ ^2.6.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    ; Serial = UART0 (conector "COM"); la consola también responde por el USB
    ; nativo (USBSerial, conector "USB"). Ver src/serial_io.cpp.
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_flags = -Wall -Wextra -Wno-unused-parameter

; ESP32-S3-WROOM-1 N16R8: 16 MB de flash. La PSRAM no se usa: la voz se graba
; directamente en la flash, así que no hace falta configurarla.
[env:esp32-s3-n16r8]
extends = esp32s3
board_upload.flash_size = 16MB
board_build.partitions = partitions/esp32s3_16mb.csv

; Módulos N8, N8R2 o N8R8: 8 MB de flash, menos espacio para la cola de voz.
[env:esp32-s3-n8]
extends = esp32s3
board_upload.flash_size = 8MB
board_build.partitions = partitions/esp32s3_8mb.csv

; Pruebas unitarias de lib/core en el computador (Unity).
[env:native]
platform = native
test_framework = unity
lib_deps = ${common.lib_core_deps}
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra -Wno-unused-parameter -DUNITY_INCLUDE_DOUBLE
